server.port=8024
spring.config.import=optional:application-local.properties
spring.thymeleaf.prefix=classpath:/templates/thymeleaf/
spring.thymeleaf.check-template-location=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.suffix=.html

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/test?serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000


spring.servlet.multipart.max-file-size=900MB
spring.servlet.multipart.max-request-size=900MB
